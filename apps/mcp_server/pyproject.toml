[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "giim-mcp"
version = "0.1.0"
description = "Read-only REST adapter for GIIM using the official MCP SDK"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "httpx==0.28.1", "pydantic==2.12.5", "uvicorn==0.46.0"]

[project.optional-dependencies]
test = ["pytest==9.0.3", "pytest-asyncio==1.3.0", "respx==0.22.0", "ruff==0.15.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
