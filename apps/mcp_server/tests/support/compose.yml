name: giim-task2-fixture

# Optional fresh-stack smoke harness. No host database ports, production mounts,
# ingestion scheduler, provider credentials, or fixed container names.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: giim
      POSTGRES_DB: giim_task2_test
      POSTGRES_PASSWORD: ${GIIM_FIXTURE_PASSWORD:?Set a private random hex password}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U giim -d giim_task2_test"]
      interval: 3s
      timeout: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.17.1
    volumes:
      - qdrant:/qdrant/storage
  api:
    build:
      context: ../../../..
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://giim:${GIIM_FIXTURE_PASSWORD}@postgres:5432/giim_task2_test
      TEST_DATABASE_URL: postgresql+asyncpg://giim:${GIIM_FIXTURE_PASSWORD}@postgres:5432/giim_task2_test
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_MODEL_NAME: BAAI/bge-m3
      EMBEDDING_DEVICE: cpu
      DEEPSEEK_API_KEY: ""
      GOOGLE_API_KEY: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ${GIIM_FIXTURE_MODEL_CACHE:?Set the absolute path to an existing bge-m3 cache}:/app/.cache/huggingface:ro
      - .:/support:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
  analyst:
    build:
      context: ../../../..
      dockerfile: apps/agent/Dockerfile
    network_mode: service:api
    environment:
      GIIM_API_URL: http://127.0.0.1:8000
      GIIM_SMOKE_OUTPUT: /app/.runs/actual-api-smoke.json
    entrypoint: [python, /app/apps/mcp_server/tests/support/api_smoke.py]
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres:
  qdrant:
