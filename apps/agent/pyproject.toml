[build-system]
requires = ["setuptools==79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "giim-agent"
version = "0.1.0"
description = "Bounded Google ADK analyst using GIIM MCP evidence"
requires-python = ">=3.11"
dependencies = ["giim-mcp==0.1.0", "google-adk[mcp]==2.14.0", "google-genai==2.34.0", "pydantic==2.14.3", "PyYAML==6.0.3"]

[project.optional-dependencies]
test = ["pytest==9.0.3", "pytest-asyncio==1.3.0", "respx==0.22.0", "ruff==0.15.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.data-files]
"share/giim-agent" = ["evals/questions.yaml"]
