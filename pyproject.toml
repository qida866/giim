[project]
name = "giim"
version = "0.1.0"
description = "Global Intelligence & Impact Monitor backend scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "qdrant-client>=1.12.0",
    "structlog",
    "httpx",
    "python-dotenv",
    "feedparser",
    "python-dateutil",
    "beautifulsoup4",
    "openai>=1.50.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: 集成测试,会真实调用外部 API (如 LLM/DB),需要环境变量配置"
]
