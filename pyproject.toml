[project]
name = "giim"
version = "0.1.0"
description = "Global Intelligence & Impact Monitor backend scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "qdrant-client",
    "structlog",
    "httpx",
    "python-dotenv",
    "feedparser",
    "python-dateutil",
    "beautifulsoup4",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
